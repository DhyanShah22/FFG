# =====================================================================
# Flyway Configuration — Antarang CAP Platform (psychometric-assessment)
# =====================================================================

# Database Connection
# Host/port/database are non-secret — hardcoded here for the default target.
# Override for other environments by setting env var FLYWAY_URL directly.
flyway.url=jdbc:postgresql://localhost:5432/antarang_psytest

# User is non-secret — override via env var FLYWAY_USER if needed.
flyway.user=antarang_psytest_user

# Auth: password is NOT set here. Flyway automatically reads it from the
# environment variable FLYWAY_PASSWORD if present — no interpolation syntax
# needed, just export it before running:
#   export FLYWAY_PASSWORD=your-actual-password
# (or rely on ~/.pgpass, which psql-based tooling honors, though Flyway's
# JDBC driver does NOT read .pgpass — you must use FLYWAY_PASSWORD for Flyway.)

# Migration Files Location
flyway.locations=filesystem:backend/src/main/resources/db/migration

# Default Schema
flyway.schemas=public
flyway.table=flyway_schema_history

# Baseline Configuration (for baselining existing database environments)
# V1 and V2 have already been applied manually in target environments.
flyway.baselineVersion=2
flyway.baselineDescription=Core Tenant Org User RBAC and Profiles Consent Assignment Config

# Security & Safety Settings
# Disable flyway clean to prevent accidental schema dropping
flyway.cleanDisabled=true

# Connection Retry Settings
flyway.connectRetries=3
