spring:
  application:
    name: cap
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: adityapawar
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-secure-256-bit-secret-key-in-production}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  otp:
    validity-seconds: 150
    resend-delay-seconds: 30
    signup-session-hours: 1
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
